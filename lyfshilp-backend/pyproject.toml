[project]
name = "lyfshilp-backend"
version = "0.1.0"
description = "FastAPI backend for Lyfshilp."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.28.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "openai==1.75.0",
    "langgraph==0.4.1",
    "langchain-core==0.3.56",
    "langchain-openai==0.3.14",
    "llama-parse",
    "python-multipart==0.0.17",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "structlog==24.4.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false
